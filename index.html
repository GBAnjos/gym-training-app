<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#050505" />
    <meta name="color-scheme" content="dark" />

    <!-- Prevent stale cache on deploy -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <!-- PWA Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Vida" />

    <!-- Disable phone number detection -->
    <meta name="format-detection" content="telephone=no" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;600;700&family=Outfit:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <link rel="icon" type="image/svg+xml" href="/vite.svg" />

    <title>Vida - Gym & Life Planner</title>
    <meta name="description" content="Estrutura real. Vida real. App pessoal de planejamento de treino e vida." />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Force reload if a newer version exists (runs before React loads)
      (function() {
        var BASE = '/gym-training-app/';
        var KEY = 'vida_app_version';
        fetch(BASE + 'version.txt?_=' + Date.now(), { cache: 'no-store' })
          .then(function(r) { return r.ok ? r.text() : null; })
          .then(function(v) {
            if (!v) return;
            v = v.trim();
            var prev = localStorage.getItem(KEY);
            if (prev && prev !== v) {
              localStorage.setItem(KEY, v);
              window.location.reload();
            } else {
              localStorage.setItem(KEY, v);
            }
          })
          .catch(function() {});
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
